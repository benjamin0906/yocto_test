# POKY_BBLAYERS_CONF_VERSION is increased each time build/conf/bblayers.conf
# changes incompatibly
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

ROOTPATH = "${@os.path.abspath("${TOPDIR}/../")}"
#ROOTPATH = "/home/u29h63/yocto_test"

BBLAYERS ?= " \
  ${ROOTPATH}/poky/meta \
  ${ROOTPATH}/poky/meta-poky \
  ${ROOTPATH}/poky/meta-yocto-bsp \
  ${ROOTPATH}/meta-raspberrypi \
  ${ROOTPATH}/meta-rpilinux \
  "
